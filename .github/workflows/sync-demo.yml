name: Sync demo branch

on:
  schedule:
    # Weekly. The demo-site Vercel project builds from `demo`, not `main`, so
    # this push is what exercises the demo Contentful space against the current
    # queries. Without it a schema change that reached `main` but not the demo
    # space sits green until someone syncs by hand. See CLAUDE.md.
    - cron: "0 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          # Full history: a shallow clone cannot be pushed as a fast-forward.
          fetch-depth: 0

      - name: Fast-forward demo to main
        run: |
          set -euo pipefail

          # Explicit, rather than trusting which refs checkout happened to fetch.
          git fetch --no-tags origin main demo

          main_sha=$(git rev-parse origin/main)
          demo_sha=$(git rev-parse origin/demo)

          if [ "$main_sha" = "$demo_sha" ]; then
            echo "demo is already at ${main_sha:0:7} — nothing to do, no deployment triggered."
            exit 0
          fi

          if ! git merge-base --is-ancestor "$demo_sha" "$main_sha"; then
            echo "::error::demo (${demo_sha:0:7}) is not an ancestor of main (${main_sha:0:7})."
            echo "Something has committed to demo directly. Resolve by hand — this"
            echo "job will not force-push over it."
            exit 1
          fi

          echo "Fast-forwarding demo: ${demo_sha:0:7} -> ${main_sha:0:7}"
          git log --oneline "$demo_sha..$main_sha" | sed 's/^/  /'

          # No --force on purpose; the ancestry check above is the guard.
          git push origin "$main_sha:refs/heads/demo"
